[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
solc    = "0.8.26"
optimizer       = true
optimizer_runs  = 200
via_ir          = false

[profile.default.fuzz]
runs = 1000

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }
