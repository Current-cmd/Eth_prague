[workspace]
resolver = "2"
members = ["methods", "host"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
risc0-zkvm = { version = "3.0.3", default-features = false }
alloy-sol-types = "1.0"
alloy-primitives = { version = "1.0", default-features = false }
light-poseidon = { version = "0.3", default-features = false }
ark-bn254 = "0.5"
ark-ff = "0.5"
serde = { version = "1.0", default-features = false }
serde_json = "1.0"
hex = "0.4"
anyhow = "1.0"
