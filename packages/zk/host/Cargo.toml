[package]
name = "shieldpass-host"
version.workspace = true
edition.workspace = true

[[bin]]
name = "shieldpass-prove"
path = "src/main.rs"

[[bin]]
name = "image-id"
path = "src/image_id.rs"

[[bin]]
name = "compute-demo-root"
path = "src/compute_demo_root.rs"

[dependencies]
risc0-zkvm = { workspace = true, default-features = false, features = ["client"] }
alloy-sol-types = { workspace = true }
alloy-primitives = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
bincode = "1.3"
shieldpass-methods = { path = "../methods" }
primitive-types = "0.12"
sha3 = "0.10"

[build-dependencies]
risc0-build = "3.0"
